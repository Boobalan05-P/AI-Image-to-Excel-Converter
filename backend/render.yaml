services:
  - type: web
    name: image-to-excel-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    # EasyOCR can take longer than Gunicorn's 30-second default on Render's
    # free CPU instances, especially immediately after a service cold start.
    startCommand: "gunicorn --directory backend --workers 1 --threads 1 --timeout 180 --graceful-timeout 30 app:app"
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: DEFAULT_OCR_ENGINE
        value: easyocr
      - key: WARM_OCR_ON_STARTUP
        value: "true"
